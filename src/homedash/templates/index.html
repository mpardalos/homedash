{% extends "base.html" %}

{% block content %}
<nav class="service-grid" aria-label="Services">
  {% for name, svc in services.items() %}
    <a href="{{ svc['url'] }}">
      <img src="{{ svc['icon'] }}" alt="" width="32" height="32">
      {{ name }}
      {% if 'service' in svc %}
      <div sse-connect="/service/{{ svc['service'] }}/state">
	<div sse-swap="state"></div>
      </div>
      {% endif %}
    </a>
  {% endfor %}
</nav>
{% endblock %}
