[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homedash"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "starlette",
  "sse-starlette",
  "uvicorn",
  "jinja2"
]

[project.scripts]
homedash = "homedash.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homedash = ["templates/*.html", "static/*.css", "static/vendor/*"]
